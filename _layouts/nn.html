<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    {% include navigation.html %}
    <main class="nn-main">
      <article class="post nn-post">
        <header class="post-header">
          <h1 class="post-title">{{ page.title }}</h1>
          <div class="post-line"></div>
          <div class="post-meta">
            <time datetime="{{ page.date }}" class="post-date">{{ page.date | date: "%B %d, %Y" }}</time>
          </div>
          {% if page.tags.size > 0 %}
          <div class="post-tags">
            {% for tag in page.tags %}
            <a href="{{ '/tags' | prepend: site.baseurl }}#{{ tag | slugify }}" class="tag">{{ tag }}</a>
            {% endfor %}
          </div>
          {% endif %}
        </header>

        {{ content }}
      </article>
    </main>
    {% include footer.html %}
  </body>
</html>
